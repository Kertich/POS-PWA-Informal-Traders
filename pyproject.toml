[project]
name = "poshawker"
version = "0.1.0"
description = "Offline-first Point of Sale API for informal traders in Kenya"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "pwdlib[argon2]==0.2.1",
    "python-multipart==0.0.19",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false
